apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-management-service
  namespace: buroqet
  labels:
    app: order-management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-management-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: order-management-service
    spec:
      containers:
        - name: order-management-service
          # GANTI <your-github-username> dengan username GitHub org kalian
          image: ghcr.io/zharfanfw/order-management-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-secret
                  key: database_url
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: order-config
                  key: kafka_broker
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-management-service
  namespace: buroqet
  labels:
    app: order-management-service
spec:
  selector:
    app: order-management-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8080
  type: ClusterIP