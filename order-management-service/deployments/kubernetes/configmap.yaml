apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: buroqet
  labels:
    app: order-management-service
data:
  kafka_broker: "GANTI_DENGAN_UPSTASH_KAFKA_BROKER"
  app_port: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-secret
  namespace: buroqet
  labels:
    app: order-management-service
type: Opaque
# ⚠️ FILE INI JANGAN DI-COMMIT dengan nilai asli
# DATABASE_URL format: host=<host> user=<user> password=<pass> dbname=order_db port=5432 sslmode=require
# Gunakan Neon.tech (gratis) untuk PostgreSQL
stringData:
  database_url: "host=GANTI.neon.tech user=GANTI password=GANTI dbname=order_db port=5432 sslmode=require"