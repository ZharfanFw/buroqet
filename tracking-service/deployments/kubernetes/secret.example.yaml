
apiVersion: v1
kind: Secret
metadata:
  name: tracking-secret
  namespace: buroqet
  labels:
    app: tracking-service
type: Opaque
# ⚠️ FILE INI JANGAN DI-COMMIT! Tambahkan ke .gitignore
# Cara generate nilai base64:
#   echo -n "nilai_asli" | base64
#
# MongoDB Atlas connection string:
#   echo -n "mongodb+srv://user:pass@cluster.mongodb.net/tracking_db?retryWrites=true&w=majority" | base64
#
# Upstash Redis password:
#   echo -n "password_dari_upstash_dashboard" | base64
stringData:
  # Lebih mudah: pakai stringData (tidak perlu base64 manual)
  # Kubernetes akan otomatis encode ke base64
  mongo_uri: "GANTI_DENGAN_MONGODB_ATLAS_CONNECTION_STRING"
  redis_password: "GANTI_DENGAN_UPSTASH_REDIS_PASSWORD"