apiVersion: v1
kind: Secret
metadata:
  name: tracking-secret
  labels:
    app: tracking-service
type: Opaque
# PENTING: Ganti value di bawah dengan nilai base64 yang sebenarnya.
# Cara encode: echo -n "nilai_asli" | base64
#
# Contoh:
#   echo -n "mongodb://user:pass@mongo:27017" | base64
#   echo -n "redis-password-here" | base64
#
# FILE INI TIDAK BOLEH DI-COMMIT KE GIT DENGAN NILAI ASLI!
# Tambahkan secret.yaml ke .gitignore.
data:
  # MongoDB connection string (base64 encoded)
  # Default: mongodb://localhost:27017/tracking_db
  mongo_uri: bW9uZ29kYjovL2xvY2FsaG9zdDoyNzAxNy90cmFja2luZ19kYg==

  # Redis password (base64 encoded), kosongkan jika tidak ada password
  # Default: (kosong)
  redis_password: ""