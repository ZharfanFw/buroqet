apiVersion: v1
kind: Service
metadata:
  name: dispatch-fleet-service
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
spec:
  selector:
    app: dispatch-fleet-service
  ports:
    - protocol: TCP
      port: 8083       # port yang diakses service lain dalam cluster
      targetPort: 8081 # port yang didengarkan container
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-config
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
data:
  # Nama PostgreSQL Service di dalam K8s cluster (bukan localhost, bukan IP)
  # Sesuai container name di project_context.md: buroqet-postgres
  db_host: "buroqet-postgres"
  app_port: "8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatch-secret
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
type: Opaque
# ⚠️ JANGAN DI-COMMIT dengan nilai asli ke Git — tambahkan ke .gitignore
# Nilai di bawah sesuai dengan POSTGRES_USER/PASSWORD di docker-compose project ini
stringData:
  db_user: "user"
  db_password: "pass"