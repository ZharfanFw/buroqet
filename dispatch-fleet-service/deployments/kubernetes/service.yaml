apiVersion: v1
kind: Service
metadata:
  name: dispatch-fleet-service
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
spec:
  selector:
    app: dispatch-fleet-service
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8081
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatch-config
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
data:
  db_host: "GANTI.neon.tech"
  app_port: "8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: dispatch-secret
  namespace: buroqet
  labels:
    app: dispatch-fleet-service
type: Opaque
# ⚠️ FILE INI JANGAN DI-COMMIT dengan nilai asli
stringData:
  db_user: "GANTI"
  db_password: "GANTI"