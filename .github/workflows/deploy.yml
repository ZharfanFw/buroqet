name: Build & Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:       # bisa trigger manual dari GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Detect changed services
  # Hanya build service yang file-nya berubah
  # ─────────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tracking:  ${{ steps.filter.outputs.tracking }}
      auth:      ${{ steps.filter.outputs.auth }}
      order:     ${{ steps.filter.outputs.order }}
      dispatch:  ${{ steps.filter.outputs.dispatch }}
      pricing:   ${{ steps.filter.outputs.pricing }}
      settlement: ${{ steps.filter.outputs.settlement }}
      epod:      ${{ steps.filter.outputs.epod }}
      warehouse:  ${{ steps.filter.outputs.warehouse }}
      frontend:  ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tracking:
              - 'tracking-service/**'
            auth:
              - 'auth-service/**'
            order:
              - 'order-management-service/**'
            dispatch:
              - 'dispatch-fleet-service/**'
            pricing:
              - 'pricing-service/**'
            settlement:
              - 'settlement-service/**'
            epod:
              - 'epod-service/**'
            warehouse:
              - 'warehouse-service/**'
            frontend:
              - 'frontend/**'

  # ─────────────────────────────────────────────────────────
  # JOB 2: Build & Push Images ke ghcr.io
  # ─────────────────────────────────────────────────────────
  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # diperlukan untuk push ke ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: tracking-service
            context: ./tracking-service
            dockerfile: ./tracking-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.tracking }}
          - service: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.auth }}
          - service: order-management-service
            context: ./order-management-service
            dockerfile: ./order-management-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.order }}
          - service: dispatch-fleet-service
            context: ./dispatch-fleet-service
            dockerfile: ./dispatch-fleet-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.dispatch }}
          - service: pricing-service
            context: ./pricing-service
            dockerfile: ./pricing-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.pricing }}
          - service: settlement-service
            context: ./settlement-service
            dockerfile: ./settlement-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.settlement }}
          - service: epod-service
            context: ./epod-service
            dockerfile: ./epod-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.epod }}
          - service: warehouse-service
            context: ./warehouse-service
            dockerfile: ./warehouse-service/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.warehouse }}
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/deployments/Dockerfile
            changed: ${{ needs.detect-changes.outputs.frontend }}

    steps:
      - name: Skip jika tidak ada perubahan
        if: matrix.changed != 'true'
        run: echo "⏭️  Tidak ada perubahan di ${{ matrix.service }}, skip."

      - name: Checkout
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Login ke GitHub Container Registry
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────
  # JOB 3: Deploy ke AKS
  # ─────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # butuh approval manual (opsional)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login ke Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Update image tags di manifest
        run: |
          # Ganti :latest dengan SHA commit yang spesifik agar rollback mudah
          SHA="${{ github.sha }}"
          OWNER="${{ github.repository_owner }}"
          find . -path "*/kubernetes/*.yaml" -not -path "*secret*" | xargs sed -i \
            "s|ghcr.io/$OWNER/\(.*\):latest|ghcr.io/$OWNER/\1:$SHA|g"

      - name: Deploy Namespace
        run: kubectl apply -f infra/kubernetes/namespace.yaml

      - name: Deploy ConfigMaps
        run: |
          find . -path "*/kubernetes/configmap.yaml" | xargs -I{} kubectl apply -f {} -n buroqet

      - name: Deploy Services
        run: |
          find . -path "*/kubernetes/service.yaml" | xargs -I{} kubectl apply -f {} -n buroqet

      - name: Deploy Tracking Service
        if: needs.detect-changes.outputs.tracking == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl apply -f tracking-service/deployments/kubernetes/deployment.yaml -n buroqet
          kubectl rollout status deployment/tracking-service -n buroqet --timeout=120s

      - name: Deploy Auth Service
        if: needs.detect-changes.outputs.auth == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl apply -f auth-service/deployments/kubernetes/deployment.yaml -n buroqet
          kubectl rollout status deployment/auth-service-deployment -n buroqet --timeout=120s

      - name: Deploy Frontend
        if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          kubectl apply -f frontend/deployments/kubernetes/deployment.yaml -n buroqet
          kubectl rollout status deployment/frontend -n buroqet --timeout=120s

      - name: Deploy Ingress
        run: kubectl apply -f infra/kubernetes/ingress.yaml
