apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: buroqet
  labels:
    app: auth-service
data:
  # PostgreSQL: pakai Neon.tech (free PostgreSQL) atau Supabase free tier
  # Format: <host> saja, port dan credentials di Secret
  db_host: "GANTI_DENGAN_NEON_ATAU_SUPABASE_HOST"
  db_port: "5432"
  db_name: "auth_db"
  app_port: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: buroqet
  labels:
    app: auth-service
type: Opaque
# ⚠️ FILE INI JANGAN DI-COMMIT! Salin ke secret.yaml dan isi nilainya
stringData:
  db_user: "GANTI_DENGAN_DB_USER"
  db_password: "GANTI_DENGAN_DB_PASSWORD"
  # JWT secret: minimal 32 karakter random
  # Generate: openssl rand -hex 32
  jwt_secret: "GANTI_DENGAN_JWT_SECRET_MIN_32_CHARS"
