apiVersion: apps/v1
kind: Deployment
metadata:
  name: epod-service
  namespace: buroqet
  labels:
    app: epod-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epod-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: epod-service
    spec:
      containers:
        - name: epod-service
          # GANTI <your-github-username> dengan username GitHub org kalian
          image: ghcr.io/zharfanfw/epod-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: epod-config
                  key: kafka_broker
            - name: APP_PORT
              value: "8080"
            # Storage path untuk foto ePOD (di dalam container)
            - name: STORAGE_PATH
              value: "/data/epod"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"   # Lebih besar karena handle file upload
              cpu: "200m"
          # Mount persistent volume untuk penyimpanan foto ePOD
          volumeMounts:
            - name: epod-storage
              mountPath: /data/epod
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # EmptyDir untuk demo — data hilang saat pod restart
        # Untuk production: ganti dengan PersistentVolumeClaim ke Azure Blob Storage
        - name: epod-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: epod-service
  namespace: buroqet
  labels:
    app: epod-service
spec:
  selector:
    app: epod-service
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epod-config
  namespace: buroqet
  labels:
    app: epod-service
data:
  kafka_broker: "GANTI_DENGAN_UPSTASH_KAFKA_BROKER"
  app_port: "8080"