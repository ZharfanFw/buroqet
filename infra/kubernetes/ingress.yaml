apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buroqet-ingress
  namespace: buroqet
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: buroqet.local
      http:
        paths:
          # Frontend
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # Auth Service
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8080

          # Tracking Service
          - path: /api/tracking(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tracking-service
                port:
                  number: 8081

          # Order Management Service
          - path: /api/orders(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-management-service
                port:
                  number: 8082

          # Dispatch & Fleet Service
          - path: /api/dispatch(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dispatch-fleet-service
                port:
                  number: 8083

          # Pricing Service
          - path: /api/pricing(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pricing-service
                port:
                  number: 8084

          # Settlement Service
          - path: /api/settlement(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: settlement-service
                port:
                  number: 8085

          # ePOD Service
          - path: /api/epod(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: epod-service
                port:
                  number: 8086

          # Warehouse Service
          - path: /api/warehouse(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: warehouse-service
                port:
                  number: 8087
