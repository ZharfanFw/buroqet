apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: buroqet-ingress
  namespace: buroqet
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Azure: ukuran request yang diizinkan (untuk upload ePOD)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS dihandle di service level, bukan ingress
    nginx.ingress.kubernetes.io/enable-cors: "false"
    # Timeout untuk service yang lambat
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  rules:
    # GANTI buroqet.example.com dengan domain kalian
    # Kalau belum punya domain, hapus host dan pakai IP langsung (lihat catatan di bawah)
    - host: buroqet.example.com
      http:
        paths:
          # Frontend — tangkap semua yang tidak cocok dengan path API
          - path: /()(.*) 
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # Auth Service — /api/auth/...
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8080

          # Tracking Service — /api/tracking/...
          - path: /api/tracking(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tracking-service
                port:
                  number: 80

          # Order Management Service
          - path: /api/orders(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: order-management-service
                port:
                  number: 8082

          # Dispatch & Fleet Service
          - path: /api/dispatch(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dispatch-fleet-service
                port:
                  number: 8083

          # Pricing Service
          - path: /api/pricing(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pricing-service
                port:
                  number: 8084

          # Settlement Service
          - path: /api/settlement(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: settlement-service
                port:
                  number: 8085

          # ePOD Service
          - path: /api/epod(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: epod-service
                port:
                  number: 8086

          # Warehouse Service
          - path: /api/warehouse(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: warehouse-service
                port:
                  number: 8087

# CATATAN JIKA TIDAK PUNYA DOMAIN:
# Hapus bagian "host: buroqet.example.com" dan gunakan hanya path-based routing.
# Akses menggunakan IP publik Load Balancer yang didapat setelah deploy:
#   kubectl get svc -n ingress-nginx ingress-nginx-controller
# Ingress tanpa host:
#   spec:
#     rules:
#       - http:
#           paths: [...]
