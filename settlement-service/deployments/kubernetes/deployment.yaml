apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: buroqet
  labels:
    app: settlement-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: settlement-service
          # GANTI <your-github-username> dengan username GitHub org kalian
          image: ghcr.io/zharfanfw/settlement-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: settlement-config
                  key: db_host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: settlement-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: settlement-secret
                  key: db_password
            - name: DB_NAME
              value: "settlement_db"
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: settlement-config
                  key: kafka_broker
            - name: PRICING_SERVICE_URL
              value: "http://pricing-service:8084"
            - name: APP_PORT
              value: "8081"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Service sudah ada di service.yaml, ini yang baru dengan namespace
apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-config
  namespace: buroqet
  labels:
    app: settlement-service
data:
  db_host: "GANTI.neon.tech"
  kafka_broker: "GANTI_DENGAN_UPSTASH_KAFKA_BROKER"
  app_port: "8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: settlement-secret
  namespace: buroqet
  labels:
    app: settlement-service
type: Opaque
# ⚠️ FILE INI JANGAN DI-COMMIT dengan nilai asli
stringData:
  db_user: "GANTI"
  db_password: "GANTI"
