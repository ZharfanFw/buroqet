apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: buroqet
  labels:
    app: pricing-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          # 🌟 DIUBAH KE GHCR AGAR COCOK DENGAN GITHUB ACTIONS
          image: ghcr.io/zharfanfw/pricing-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres.gvmknmaybejslbghzsov:HfuyrF1xd1iUVagY@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?search_path=pricing_schema"

---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: buroqet # Disamakan agar masuk ke namespace yang sama
spec:
  selector:
    app: pricing-service
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP